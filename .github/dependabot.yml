# Weekly, grouped version updates with a low open-PR limit. Security updates are
# not grouped: they open at once, separately. The platform's default three-day
# release cooldown applies to version updates without configuration.
version: 2
updates:
  - package-ecosystem: pip          # requirements*.in compiled by pip-tools (see AGENTS.md)
    directory: /ai-engine
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    groups:
      python:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    groups:
      angular:
        applies-to: version-updates
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/*"]
      npm:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/ai-engine, /frontend]
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    groups:
      images:
        applies-to: version-updates
        patterns: ["*"]
