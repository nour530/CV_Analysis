name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-engine/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install --require-hashes -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q app
      - name: Test
        run: python -m pytest -q
      - name: Dependency audit
        # pip-audit is pinned in requirements-dev.txt; --disable-pip audits the hashed lock as written.
        run: python -m pip_audit -r requirements-dev.txt --require-hashes --disable-pip

  backend-postgres:
    name: Backend on PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engine
    services:
      postgres:
        image: postgres:16-alpine   # same major version as docker-compose.yml
        env:
          POSTGRES_DB: jobmatch
          POSTGRES_USER: jobmatch
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobmatch -d jobmatch"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://jobmatch:ci-only-not-a-secret@localhost:5432/jobmatch
      TEST_DATABASE_URL: postgresql+psycopg://jobmatch:ci-only-not-a-secret@localhost:5432/jobmatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-engine/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install --require-hashes -r requirements-dev.txt
      - name: Migrations up, down and up again
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Test on PostgreSQL
        run: python -m pytest -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Personal account: no GITLEAKS_LICENSE needed. Comments off, so the job needs no write permission.
          GITLEAKS_ENABLE_COMMENTS: "false"

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit --omit=dev
      - name: Test
        run: npm test -- --watch=false
      - name: Build
        run: npm run build -- --configuration production

  containers:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [backend, backend-postgres, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-engine
          push: false
          tags: jobmatch-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: jobmatch-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
