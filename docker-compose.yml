name: jobmatch

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobmatch}
      POSTGRES_USER: ${POSTGRES_USER:-jobmatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-jobmatch} -d $${POSTGRES_DB:-jobmatch}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - jobmatch

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - jobmatch

  migrate:
    build:
      context: ./ai-engine
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-jobmatch}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-jobmatch}}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - jobmatch

  backend:
    build:
      context: ./ai-engine
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-jobmatch}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-jobmatch}}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
      RATE_LIMIT_REDIS_FAILURE_MODE: closed
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-strict}
      ENABLE_HSTS: ${ENABLE_HSTS:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the public HTTPS frontend origin}
      AUTO_CREATE_TABLES: "false"
      ENABLE_API_DOCS: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: "true"
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.28.0.0/16}
      JOBS_CATALOG_SOURCE: ${JOBS_CATALOG_SOURCE:-database}
      JOBS_CATALOG_REFRESH_SECONDS: ${JOBS_CATALOG_REFRESH_SECONDS:-300}
      ALLOW_REMOTE_LLM_ANALYSIS: ${ALLOW_REMOTE_LLM_ANALYSIS:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - jobmatch

  job-sync:
    build:
      context: ./ai-engine
    # Fetches real job postings from the employer job-board APIs listed in
    # data/job_sources.json, then repeats every JOB_SYNC_INTERVAL_SECONDS.
    command:
      - sh
      - -c
      - exec python -m app.cli sync-jobs --loop-seconds ${JOB_SYNC_INTERVAL_SECONDS:-21600}
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-jobmatch}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-jobmatch}}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ENABLE_HSTS: ${ENABLE_HSTS:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the public HTTPS frontend origin}
      LOG_JSON: "true"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - jobmatch

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - jobmatch

volumes:
  postgres_data:
  redis_data:

networks:
  jobmatch:
    ipam:
      config:
        - subnet: 172.28.0.0/16
